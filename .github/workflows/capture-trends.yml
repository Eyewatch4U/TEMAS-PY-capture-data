# .github/workflows/capture-trends.yml
# Colector de Google Trends -> worker Monitor Temas de Interés · Paraguay (NSGroup)
# Corre en runner de GitHub (ubuntu-latest), igual que el capture de Meltwater.
name: Capture Google Trends (Temas PY)

on:
  schedule:
    - cron: "17 */6 * * *"   # cada 6 horas (Trends se actualiza lento; evita 429)
  workflow_dispatch: {}       # ejecución manual desde la pestaña Actions

concurrency:
  group: trends-temas-py
  cancel-in-progress: false

jobs:
  trends:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install --upgrade pytrends pandas "urllib3<2"

      - name: Collect & push trends
        env:
          WORKER_BASE_URL: ${{ secrets.WORKER_BASE_URL }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          TRENDS_GEO: "PY"
          TRENDS_HL: "es-PY"
          TRENDS_TZ: "180"
          # Opcional: sobrescribir keywords -> "label=query;label=query"
          # TRENDS_KEYWORDS: "BCP=BCP;Dólar=dólar;Combustible=combustible;Presupuesto=presupuesto"
        run: python trends_collector.py
